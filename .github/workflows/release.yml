name: release

# 打 tag（v*）或手动触发 → 交叉编译 → 打包成带 webui/prompts/config 的 tar.gz → 发 Release。
# 注意：主程序从磁盘读 webui/index.html（无 go:embed），单二进制跑不起来，
# 所以发布物必须是含目录的包，不能只上传裸二进制。

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"   # go.mod 要求

      - name: vet & test
        # 测试跑在 runner 本机架构（GOOS/GOARCH 交叉时测试无意义，先清掉）
        env: { GOOS: "", GOARCH: "" }
        run: |
          go vet ./...
          # 前端净化（XSS）回归需要 jsdom：runner 自带 node 但不带 jsdom。
          # 这里装上，让这条安全测试在 CI 里真跑，而不是被 skip 掩盖。
          npm install --no-save --silent --no-fund --no-audit jsdom
          go test ./...

      - name: build
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          NAME="okhuman-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist/"$NAME"
          go build -trimpath -ldflags "-s -w" -o dist/"$NAME"/okhuman .

          # 运行期必需：webui（静态页）、prompts（系统提示词）、config（默认配置）
          cp -r webui prompts config dist/"$NAME"/
          # 实值配置不入库也不入包，只带模板
          rm -f dist/"$NAME"/config/user.json
          cp README.md LICENSE dist/"$NAME"/ 2>/dev/null || cp README.md dist/"$NAME"/
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PKG=$NAME.tar.gz" >> "$GITHUB_ENV"

      - name: pack
        run: |
          cd dist
          # 归档带一层顶层目录（解压不散落）：okhuman-<ver>-<os>-<arch>/
          tar czf "$PKG" "${PKG%.tar.gz}"
          echo "归档内容："; tar tzf "$PKG" | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 顺序要紧：checkout 会清理工作区，必须在下载产物之前跑（反过来 artifacts/ 就没了，
      # 发布步按 fail_on_unmatched_files 直接失败）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要读 tag 对象本身，默认浅克隆里没有

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 用 tag 注释作为 Release 正文
        # 打 tag 时写的那段说明就是给人看的摘要；正文为空时使用者只看到三个包名。
        # 试过 GitHub 的 generate_release_notes：那一步成功但正文仍是空的，故自己写。
        run: |
          # 取 tag 对象的正文段（头部 object/type/tag/tagger 之后到文件末尾）。
          git cat-file tag "${GITHUB_REF_NAME}" | sed -n '/^$/,$p' | tail -n +2 > "$notes"
          test -s "$notes" || printf '（本次未写说明，改动见提交历史）\n' > "$notes"
          ls -l artifacts/ | head -5; wc -c "$notes"; head -3 "$notes"
        env:
          notes: ${{ github.workspace }}/RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          # 绝对路径：v0.13.0 实测这一对（%(contents) + 相对 body_path）没生效，正文退成了
          # commit message；改成从 tag 对象取正文 + 绝对路径，并把内容打进日志便于下次确诊
          # （本机没有 GitHub token，下载不了 Actions 日志，只能靠日志留证）。
          body_path: ${{ github.workspace }}/RELEASE_NOTES.md
